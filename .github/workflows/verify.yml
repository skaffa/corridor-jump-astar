name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Python reference
        run: python python/cja_star.py verify tests/fixtures/manifest.txt

      - name: C port
        run: |
          cc -O3 -std=c11 -o /tmp/cja_star_c c/cja_star.c -lm
          /tmp/cja_star_c verify tests/fixtures/manifest.txt

      - name: Rust port
        run: |
          rustc -O rust/cja_star.rs -o /tmp/cja_star_rs
          /tmp/cja_star_rs verify tests/fixtures/manifest.txt

      - name: JavaScript port
        run: node javascript/cja_star.js verify tests/fixtures/manifest.txt
